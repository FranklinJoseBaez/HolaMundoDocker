<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola Mundo, Docker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #0d6efd;
            font-size: 2rem;
            margin-bottom: 12px;
        }

        p {
            font-size: 1rem;
            line-height: 1.5;
            color: #555;
            margin-bottom: 16px;
        }

        #estado {
            display: inline-block;
            font-size: 0.9rem;
            font-weight: 500;
            color: #666;
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 8px 16px;
            border-radius: 20px;
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>¡Hola Mundo!</h1>
        <p>Aplicación web realizada con con Docker Compose y MySQL.</p>
        <p id="estado">Conectando con la base de datos...</p>
    </div>
</body>
</html>
